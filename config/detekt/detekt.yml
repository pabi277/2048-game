# Tilefold — detekt overrides on top of the default config.
# Only deviations live here; everything else is detekt's default ruleset.
build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 100
  LongParameterList:
    functionThreshold: 14
    constructorThreshold: 14
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 30
    thresholdInObjects: 30
    thresholdInEnums: 30

style:
  MagicNumber:
    # Design tokens and test fixtures legitimately use literals.
    ignoreNumbers: ["-1", "0", "1", "2", "4", "8", "16", "90", "100", "255", "2048"]
    ignoreAnnotated: ["Composable", "Preview"]
  MaxLineLength:
    maxLineLength: 130

naming:
  FunctionNaming:
    ignoreAnnotated: ["Composable"]
