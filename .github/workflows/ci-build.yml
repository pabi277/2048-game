# SPDX-License-Identifier: MIT
# Adapted from AppFlow @57597b3332ad578614a0d9d5609f9cf8a278ee8a templates/ci-build.yml.
#
# Phase 0 additions to the template, all of them the no-device quality gate:
#   * `check` task = host unit tests + Robolectric + screenshot renders + lint +
#     detekt + ktlint, so one command proves the phase;
#   * screenshot PNGs and lint/detekt/test reports are uploaded for the owner;
#   * CI runs the same Gradle tasks a developer runs locally (no emulator, ever).
#
# Signing secrets are referenced by NAME only — never committed, never printed:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD
name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      record_screenshots:
        description: 'Re-record the screenshot goldens and commit them to this branch'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: No-device gate, debug build, progress APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The ubuntu runner image already ships the Android SDK. The separate
      # setup-android action is not used: it is Node-20-deprecated and fails on
      # the current runner image (run 40061789029, step 4). Accept the licences
      # so AGP can install any missing platform/build-tools itself.
      - name: Verify Android SDK and accept licences
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at $SDK"
          ls "$SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed | tail -20 || true
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Host tests, lint, detekt, ktlint
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --console=plain check 2>&1 | tee gradle-check.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain assembleDebug 2>&1 | tee gradle-assemble.log

      # Gradle's own failure lines, surfaced as check-run annotations so a
      # failure is readable from the API without downloading a log bundle.
      - name: Summarise Gradle failures as annotations
        if: failure()
        shell: bash
        run: |
          set +e
          # ktlint findings (main and test source sets).
          if [ -d app/build/reports/ktlint ]; then
            find app/build/reports/ktlint -name '*.txt' | while IFS= read -r report; do
              head -20 "$report" \
                | while IFS= read -r line; do echo "::error file=${report}::${line}"; done
            done
          fi
          # detekt prints a summary only; its findings live in the text report.
          if [ -f app/build/reports/detekt/detekt.txt ]; then
            head -60 app/build/reports/detekt/detekt.txt \
              | while IFS= read -r line; do echo "::error file=detekt.txt::${line}"; done
          fi
          # GitHub keeps only about ten annotations per step, so each log's
          # diagnostics are collapsed into ONE multi-line annotation (newlines
          # escaped as %0A) instead of dozens that would be dropped. ANSI colour
          # codes are stripped first: Gradle still colours its Kotlin compiler
          # output even with --console=plain, and a coloured `e: file:…` line
          # otherwise never matches a `^e: ` pattern.
          for log in gradle-check.log gradle-assemble.log; do
            [ -f "$log" ] || continue
            sed -r 's/\x1B\[[0-9;]*[mK]//g' "$log" > "/tmp/${log}.clean"
            clean="/tmp/${log}.clean"
            excerpt="$(
              echo "== Kotlin / task errors =="
              grep -anE '^(e|w): |^> Task .* FAILED|error:|FAILURE:' "$clean" | head -30
              echo "== What went wrong =="
              grep -an -A 12 '^\* What went wrong:' "$clean" | head -20
              echo "== .kt findings =="
              grep -anE '\.kt:[0-9]+:[0-9]+: ' "$clean" | head -30
              echo "== tail =="
              tail -40 "$clean"
            )"
            excerpt="${excerpt//'%'/'%25'}"
            excerpt="${excerpt//$'\r'/''}"
            excerpt="${excerpt//$'\n'/'%0A'}"
            echo "::error file=${log}::${excerpt}"
          done

      - name: Summarise lint results as annotations
        if: failure()
        shell: bash
        run: |
          set +e
          for report in app/build/reports/lint-results*.xml; do
            [ -f "$report" ] || continue
            echo "lint report $report found"
            # Extract error severity issues
            grep -a 'severity="Error"' "$report" | head -60 | while IFS= read -r line; do
              esc="${line//%/%25}"
              esc="${esc//$'\r'/}"
              echo "::error file=${report}::${esc:0:500}"
            done
            # Also show full file location tags
            grep -a '<location' "$report" | head -20 | while IFS= read -r line; do
              esc="${line//%/%25}"
              echo "::error file=${report}::${esc:0:500}"
            done
            # Fallback: show first error issue block
            awk '/<issue.*severity="Error"/,/<\/issue>/ {print; if (/<\/issue>/) exit}' "$report" | head -80 | while IFS= read -r line; do
              esc="${line//%/%25}"
              esc="${esc//$'\r'/}"
              echo "::error file=${report}::${esc:0:500}"
            done
          done
          for report in app/build/reports/lint-results*.txt; do
            [ -f "$report" ] || continue
            head -100 "$report" | while IFS= read -r line; do
              esc="${line//%/%25}"
              echo "::error file=${report}::${esc:0:500}"
            done
          done

      # From phase 0-D the screenshots are goldens: the committed images are the
      # UI contract and `testDebugUnitTest` fails on a visual diff. Only the
      # images that exist in the tree (or the diffs of a failing run) can be
      # uploaded, so assert the contract is really in place.
      - name: Verify screenshot goldens exist
        shell: bash
        run: |
          set -euo pipefail
          goldens=$(find app/src/test/screenshots -name '*.png' | wc -l)
          echo "::notice::committed screenshot goldens: $goldens"
          find app/src/test/screenshots -name '*.png' | sort
          if [ "$goldens" -lt 1 ]; then
            echo "::error::No screenshot goldens in app/src/test/screenshots — the UI contract is missing"
            exit 1
          fi
          if [ -d app/build/roborazzi ]; then
            echo "::notice::diff/actual images from this run:"
            find app/build/roborazzi -name '*.png' | head -20
          fi

      - name: Upload progress APK (the downloadable result of this phase)
        uses: actions/upload-artifact@v4
        with:
          name: app-progress-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Failing test names and messages, readable from the API.
      - name: Summarise test failures as annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import glob
          import xml.etree.ElementTree as ET

          count = 0
          for path in glob.glob("app/build/test-results/test*UnitTest/*.xml"):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  for failure in list(case.iter("failure")) + list(case.iter("error")):
                      message = " ".join((failure.get("message") or "").split())[:400]
                      detail = " ".join((failure.text or "").split())[:600]
                      print(f"::error file={path}::{case.get('classname')}#{case.get('name')}: {message} | {detail}")
                      count += 1
          print(f"annotated {count} failing tests")
          PYEOF

      - name: Upload screenshots (goldens, plus diffs of a failing run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: |
            app/src/test/screenshots/**
            app/build/roborazzi/**
            app/build/**/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Upload quality-gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/detekt/**
            gradle-*.log
          if-no-files-found: warn
          retention-days: 14

  # The UI reference site (design/reference/) is a design specification, never
  # shipped. This job is not part of the app gate; it only proves the frozen
  # tokens in docs/UI-REFERENCE.md still match the site that renders them, and
  # that the site builds. No browser, no screenshots, no new app dependency.
  ui-reference:
    name: UI reference tokens match the doc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: design/reference/package-lock.json

      - name: Install reference dependencies
        working-directory: design/reference
        run: npm ci --no-audit --no-fund

      - name: Tokens, contrast and screen coverage
        working-directory: design/reference
        run: npm run verify

      - name: Reference builds
        working-directory: design/reference
        run: npm run build

  # Deliberate golden re-recording (workflow_dispatch only). A visual change is
  # approved by recording the new goldens and reviewing them — never by
  # deleting the test, and never automatically on a push. The commit is made
  # back to the same non-main branch so the images are reviewable in git.
  record-screenshots:
    name: Record screenshot goldens
    # Two ways to ask for a re-record, both explicit: a workflow dispatch with
    # `record_screenshots=true`, or a commit whose message contains
    # `[record-goldens]` (that is how it is triggered when the API token cannot
    # dispatch workflows). Never on `main`, never on an ordinary push.
    if: |
      github.ref != 'refs/heads/main' && (
        (github.event_name == 'workflow_dispatch' && inputs.record_screenshots) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[record-goldens]'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Android SDK and accept licences
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Record goldens
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --console=plain recordRoborazziDebug

      - name: Commit any changed goldens to this branch
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain app/src/test/screenshots)" ]; then
            echo "::notice::goldens already match — nothing to record"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/screenshots
          git commit -m "Record screenshot goldens (deliberate re-record)"
          git push origin "HEAD:${{ github.ref_name }}"

  # The release lane needs the keystore, which only the owner can add. Until
  # those secrets exist this job reports the fact and skips, so a main push is
  # never red for a missing secret that release work has not reached yet. Once
  # all four are present the lane runs and still fails hard on any problem.
  signing-ready:
    name: Check release signing secrets
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - id: check
        name: Report whether the four signing secrets are present
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing="$missing $name"
            fi
          done
          if [[ -n "$missing" ]]; then
            echo "::notice::Release signing not configured (missing:$missing) — signed lane skipped; debug progress APK above is the phase result."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "All four signing secrets present."
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  signed-release:
    name: Signed release AAB and APK
    needs: [test, signing-ready]
    if: needs.signing-ready.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The ubuntu runner image already ships the Android SDK. The separate
      # setup-android action is not used: it is Node-20-deprecated and fails on
      # the current runner image (run 40061789029, step 4). Accept the licences
      # so AGP can install any missing platform/build-tools itself.
      - name: Verify Android SDK and accept licences
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at $SDK"
          ls "$SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed | tail -20 || true
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Prepare signing key on runner
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/release-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release AAB and APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace bundleRelease assembleRelease

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-android-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
